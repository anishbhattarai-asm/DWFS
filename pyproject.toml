[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dwfs"
dynamic = ["version"]
description = "Draw any picture with Fourier series epicycles"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anish Bhattarai" }]
requires-python = ">=3.9"
keywords = ["fourier", "epicycles", "animation", "drawing", "line art"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.21",
    "matplotlib>=3.5",
    "opencv-python>=4.5",
    "scikit-image>=0.19",
    "scipy>=1.7",
    "Pillow>=9.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/anishbhattarai-asm/DWFS"
Issues = "https://github.com/anishbhattarai-asm/DWFS/issues"

[project.scripts]
dwfs = "dwfs.cli:main"

[tool.setuptools]
packages = ["dwfs"]

[tool.setuptools.dynamic]
version = { attr = "dwfs.__version__" }
